<!--
==========================================================================
EJERCICIO 01 — Fundamentos JavaScript
==========================================================================
APRENDIZAJES PRINCIPALES:

1) JavaScript es un lenguaje INTERPRETADO (se ejecuta línea por línea),
   MULTIPARADIGMA y de TIPADO DINÁMICO.

2) Para ejecutar JS en el navegador, lo cargamos con <script src="...">
   (idealmente antes de cerrar </body>).

3) La CONSOLA del navegador (F12 → Console) es nuestra herramienta principal
   para ver lo que el script imprime con console.log().

NOTA: para este ejercicio el HTML es mínimo, casi todo pasa en js/main.js.
La consola es donde vas a ver los resultados.
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej 01 — Fundamentos JS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main>
        <h1>Fundamentos de JavaScript</h1>
        <p class="aviso">
            🛠️ Abrí la <strong>consola del navegador</strong> con <kbd>F12</kbd>
            (o <kbd>Cmd + Option + I</kbd> en Mac) y andá a la pestaña
            <strong>Console</strong>. Toda la salida de este ejercicio aparece ahí.
        </p>
    </main>

    <!-- Cargamos el script al final del body. Así el HTML ya está listo
         cuando JS empieza a correr. -->
    <script src="js/main.js"></script>
</body>
</html>
